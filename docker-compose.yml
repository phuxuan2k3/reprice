# Dev: `docker compose up -d db` rồi chạy backend và web trên máy (README.md).
# Chạy thử như khi deploy: `docker compose --profile app up --build` → http://localhost:8080
services:
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://reprice:reprice@db:5432/reprice?sslmode=disable
      JWT_SECRET: local-docker-secret-change-me-0123456789
      DEMO_MODE: "true"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reprice
      POSTGRES_PASSWORD: reprice
      POSTGRES_DB: reprice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reprice"]
      interval: 2s
      retries: 15
volumes:
  pgdata:
  uploads:
